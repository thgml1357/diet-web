name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-wrapper/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Capacitor Android project
        run: |
          mkdir -p "$RUNNER_TEMP/wrap" && cd "$RUNNER_TEMP/wrap"
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cp -r "$GITHUB_WORKSPACE/android-wrapper/www" ./www
          cp "$GITHUB_WORKSPACE/android-wrapper/capacitor.config.json" .
          npx cap add android
          npx cap sync android
      - name: App icon
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          cd "$RUNNER_TEMP/wrap/android/app/src/main/res"
          rm -rf mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert "$GITHUB_WORKSPACE/web/icons/icon-512.png" -resize ${s}x${s} "mipmap-$n/$f.png"
            done
          done
      - name: Build debug APK
        run: |
          cd "$RUNNER_TEMP/wrap/android"
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/diet.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: diet-apk
          path: diet.apk
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest diet.apk --target "$GITHUB_SHA" \
            --title "갤럭시 앱 (APK)" \
            --notes "갤럭시에서 diet.apk를 내려받아 설치하세요. 웹앱을 고치면 앱도 자동으로 바뀌어요(재설치 불필요)."
